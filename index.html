</style></head><body><div class="app"><div class="flag"><i></i><i></i><i></i></div><header><h1><span class="brandroad">◢</span>NATINF Route <span class="header-version">V38</span></h1><small>INFRACTIONS ROUTIÈRES · AIDE À LA RECHERCHE</small></header><main class="body" id="main"></main><nav id="nav" hidden></nav></div><script>
const records=[];let databaseReady=false,databaseError=false;
const DB_KEY='natinf-route-database-v12',DB_META='natinf-route-database-meta-v12';
const DATASET_URL='https://www.data.gouv.fr/api/1/datasets/liste-des-infractions-en-vigueur-de-la-nomenclature-natinf/';
let dbMeta={sourceDate:'2026-10-20',checkedAt:null,installedAt:null,sourceTitle:'NATINF octobre 2026'},updateState='idle',updateMessage='';
const dateFR=v=>{if(!v)return 'Jamais';const d=new Date(v);return Number.isNaN(d.getTime())?'Non renseignée':d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})};
function updatePanel(){return `<div class="update-box">${updateState==='loading'?'<span class="spinner" role="status" aria-label="Téléchargement en cours"></span>':'<span aria-hidden="true">↻</span>'}<div class="update-text"><strong>${updateState==='loading'?'Vérification / téléchargement NATINF…':updateState==='error'?'Mise à jour indisponible':'Base NATINF routière'}</strong><div class="update-meta">${records.length.toLocaleString('fr-FR')} références · ${escapeHtml(dbMeta.sourceTitle)} · disponible hors ligne<br>Dernière mise à jour installée : ${dbMeta.installedAt?dateFR(dbMeta.installedAt):'Base initiale · octobre 2026'}<br>Dernière vérification : ${dateFR(dbMeta.checkedAt)}${updateMessage?`<br><span class="${updateState==='error'?'update-error':''}">${escapeHtml(updateMessage)}</span>`:''}</div></div><button data-update="1" ${updateState==='loading'?'disabled':''}>Actualiser</button></div>`}
function applyData(data){records.splice(0,records.length,...data.map(x=>({id:String(x[0]),nature:x[1],title:x[2],defined:x[3],punished:x[4],cat:'',keywords:'',road:true})));for(const r of records)r.cat=categoryFor(r);databaseReady=true;databaseError=false;render()}
// Analyseur CSV compatible avec les cellules entre guillemets et les points-virgules internes.
function parseCSV(text){const out=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===';'&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))out.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);out.push(row)}return out}
function roadCSV(rows){const head=rows[0].map(x=>normalizeText(x).trim());const idx=names=>head.findIndex(h=>names.some(n=>h.includes(n)));const a=idx(['numero natinf']),b=idx(['nature de l']),c=idx(['qualification de l']),d=idx(['definie par']),e=idx(['reprimee par']);if([a,b,c,d,e].some(i=>i<0))throw Error('Colonnes CSV non reconnues');const result=[];for(const r of rows.slice(1)){const id=(r[a]||'').trim();if(!/^\d+$/.test(id))continue;const defined=r[d]||'',punished=r[e]||'';if(!/\bC\.\s*ROUTE\b|CODE DE LA ROUTE/i.test(defined+' '+punished))continue;result.push([id,r[b]||'',r[c]||'',defined,punished])}if(result.length<500)throw Error('Le fichier routier paraît incomplet');return result}
async function checkUpdates(force=false){if(updateState==='loading'||!navigator.onLine)return;const last=localStorage.getItem('natinf-route-last-check');if(!force&&last&&Date.now()-Number(last)<24*3600*1000)return;updateState='loading';updateMessage='';render();try{
 const res=await fetch(DATASET_URL,{cache:'no-store'});if(!res.ok)throw Error('Catalogue inaccessible');const catalog=await res.json();
 const resources=(catalog.resources||[]).filter(r=>r.url&&/csv/i.test(r.format||r.url)&&/natinf/i.test(r.title||''));
 const score=r=>{const name=(r.title||'').toLowerCase();const months={'janvier':1,'avril':4,'juillet':7,'octobre':10};const year=Number((name.match(/20\d{2}/)||[])[0]||0);const month=Object.entries(months).find(([m])=>name.includes(m));return year*100+(month?month[1]:0)};
 resources.sort((a,b)=>score(b)-score(a));const latest=resources[0];if(!latest)throw Error('Aucun CSV NATINF identifié');
 const version=score(latest),current=Number(dbMeta.sourceDate.slice(0,4))*100+Number(dbMeta.sourceDate.slice(5,7));
 if(version>current){updateMessage='Téléchargement de '+latest.title+'…';render();const r=await fetch(latest.url,{cache:'no-store'});if(!r.ok)throw Error('Téléchargement refusé');const bytes=await r.arrayBuffer();let content=new TextDecoder('utf-8',{fatal:false}).decode(bytes);if(content.includes('�'))content=new TextDecoder('windows-1252').decode(bytes);const data=roadCSV(parseCSV(content.replace(/^\uFEFF/,'')));const installed=new Date().toISOString();const next={sourceDate:String(Math.floor(version/100))+'-'+String(version%100).padStart(2,'0')+'-01',sourceTitle:latest.title,installedAt:installed,checkedAt:installed};
 try{localStorage.setItem(DB_KEY,JSON.stringify(data));localStorage.setItem(DB_META,JSON.stringify(next))}catch(e){throw Error('Espace de stockage insuffisant pour conserver la mise à jour hors ligne')}
 dbMeta=next;applyData(data);updateMessage=`${data.length.toLocaleString('fr-FR')} références routières installées.`;
 }else{dbMeta.checkedAt=new Date().toISOString();localStorage.setItem(DB_META,JSON.stringify(dbMeta));updateMessage='La base installée est à jour.'}
 localStorage.setItem('natinf-route-last-check',String(Date.now()));updateState='success';render();
 }catch(e){updateState='error';updateMessage='Base hors ligne conservée. '+(e.message||'Vérification impossible');render()}}

const normalizeText=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const roadWords=/\b(c\.route|code de la route|conducteur|conduite|vehicule|permis de conduire|circulation routiere|automobil|motocycl|cyclomoteur|vitesse|stationnement|immatriculation|pieton|transport routier|assurance automobile|ceinture de securite|telephone au volant|alcool au volant)\b/i;
function categoryFor(r){
 const t=normalizeText(r.title);
 if(/telephone|portable|ecouteur|oreillette/.test(t))return 'Téléphone';
 if(/vitesse|radar/.test(t))return 'Vitesse';
 if(/alcool|ivresse|ethyl/.test(t))return 'Alcool';
 if(/stupefiant|drogue|cannabis/.test(t))return 'Stupéfiants';
 if(/assurance/.test(t))return 'Assurance';
 if(/permis|certificat d'immatriculation|carte grise|immatriculation|titre de conduite/.test(t))return 'Titres';
 if(/ceinture|casque|pneumatique|eclairage|feux|retrovis|equipement/.test(t))return 'Équipement';
 return 'Infractions courantes';
}
function isRoad(r){return roadWords.test(normalizeText(r.title+' '+r.defined+' '+r.punished))}
async function loadDatabase(){
 try{
  const saved=localStorage.getItem(DB_KEY);if(saved){const meta=JSON.parse(localStorage.getItem(DB_META)||'null');if(meta)dbMeta=meta;applyData(JSON.parse(saved))}
  else{const res=await fetch('./natinf-octobre2026.json');if(!res.ok)throw Error('Données indisponibles');applyData(await res.json())}
  if(navigator.onLine)checkUpdates(false);

 if(page==='about'){main.innerHTML=top+`<h2>À propos</h2><div class="powered-by"><span>POWERED BY</span><strong>Charles CABELLO</strong><span class="about-inline-version">Version V38</span></div><div class="detail"><h3>NATINF Route</h3><p>Référentiel importé : <strong>${escapeHtml(dbMeta.sourceTitle)}</strong>.</p><p>${count.toLocaleString('fr-FR')} références issues du fichier fourni. La rubrique Route utilise un classement indicatif par mots-clés ; la recherche « Tous les NATINF » couvre l’ensemble du fichier.</p><p>Les favoris sont conservés lors des mises à jour sur la même origine Netlify (sans effacer les données Safari). La base est enregistrée dans les fichiers de l’application et mise en cache pour consultation hors ligne après le premier chargement complet.</p><p>La nomenclature ne contient ni montants individualisés ni retraits de points. Les retraits de points vérifiés sont ajoutés pour une sélection de NATINF, sans extrapolation. Vérifiez les textes en vigueur et la situation juridique avant toute verbalisation.</p></div><section class="settings-card"><h3>Paramètres</h3><div class="setting"><label>Apparence</label><select id="pref-theme"><option value="auto" ${editPrefs().theme==='auto'?'selected':''}>Automatique</option><option value="light" ${editPrefs().theme==='light'?'selected':''}>Clair</option><option value="dark" ${editPrefs().theme==='dark'?'selected':''}>Sombre</option></select></div><div class="setting"><label>Taille du texte</label><select id="pref-scale">${[85,100,110,120].map(n=>`<option value="${n}" ${editPrefs().scale===n?'selected':''}>${({85:'Très petit',100:'Petit',110:'Moyen',120:'Grand'})[n]}</option>`).join('')}</select></div><div class="setting"><label>Déconnexion après</label><select id="pref-idle">${[[60,'1 minute'],[120,'2 minutes'],[300,'5 minutes']].map(([n,l])=>`<option value="${n}" ${editPrefs().idle===n?'selected':''}>${l}</option>`).join('')}</select></div><button class="button save-settings" data-save-settings>Enregistrer les paramètres</button><p class="muted" id="settings-message" role="status"></p><div class="connection-actions"><p id="online-status" class="muted">${navigator.onLine?'<span class="connection-dot online">●</span> Connecté':'<span class="connection-dot offline">●</span> Hors ligne'}</p><button class="button logout-settings" data-page="home">Se déconnecter</button></div><button class="button check-update-settings" data-check-app>↻ Vérifier la mise à jour de l’application</button></section>${status}`;return}

 if(b.dataset.renameGroup!==undefined){if(!vaultUnlocked||!codesEditMode)return;const keys=[...new Set(accessCodes[profile].map(a=>normalizeText(a.place)))],key=keys[Number(b.dataset.renameGroup)],items=accessCodes[profile].filter(a=>normalizeText(a.place)===key),name=prompt('Nom de la commune',items[0]?.place||'');if(name?.trim()){items.forEach(a=>a.place=name.trim());showSavePass()}return}if(b.dataset.backupExport!==undefined){exportVault();return}
