</style></head><body><div class="app"><div class="flag"><i></i><i></i><i></i></div><header><h1><span class="brandroad">◢</span>NATINF Route</h1><small>INFRACTIONS ROUTIÈRES · AIDE À LA RECHERCHE</small></header><main class="body" id="main"></main><nav id="nav" hidden></nav></div><script>
const records=[{id:'route1',title:'Téléphone tenu en main par le conducteur',cat:'Téléphone',keywords:'portable conduite',detail:'Article R.412-6-1 du Code de la route. Contravention de 4e classe, retrait de 3 points. Vérifier la qualification et le NATINF dans le référentiel officiel.'},{id:'route2',title:'Non-port de la ceinture de sécurité',cat:'Équipement',keywords:'ceinture',detail:'Article R.412-1 du Code de la route. Contravention de 4e classe ; retrait de 3 points pour le conducteur selon les conditions applicables.'},{id:'route3',title:'Non-respect d’un feu rouge',cat:'Infractions courantes',keywords:'feu signal rouge',detail:'Article R.412-30 du Code de la route. Contravention de 4e classe, retrait de 4 points.'},{id:'route4',title:'Défaut d’assurance obligatoire',cat:'Assurance',keywords:'non assurance',detail:'Article L.324-2 du Code de la route et L.211-1 du Code des assurances. Délit ; modalités de sanction selon les circonstances.'},{id:'route5',title:'Conduite sans permis correspondant à la catégorie',cat:'Titres',keywords:'permis défaut',detail:'Article L.221-2 du Code de la route. Délit ; vérifier la situation exacte du titre.'},{id:'route6',title:'Conduite sous l’empire d’un état alcoolique',cat:'Alcool',keywords:'alcoolémie',detail:'La qualification dépend notamment du taux mesuré, du statut du conducteur et de la récidive. Vérifier les seuils et les articles applicables.'},{id:'route7',title:'Excès de vitesse',cat:'Vitesse',keywords:'vitesse radar',detail:'La qualification et les sanctions dépendent du dépassement retenu et du contexte. Vérifier la vitesse retenue, la limite et la réglementation en vigueur.'},{id:'route8',title:'Conduite après usage de stupéfiants',cat:'Stupéfiants',keywords:'drogue cannabis',detail:'Article L.235-1 du Code de la route. Délit ; vérifier les éléments constitutifs et les procédures applicables.'}];
let page='home',profile=null,query='',cat='',detail=null,favs=[];let pendingProfile=null,pinDigits='',pinError='';const ACCESS_PIN='2062';try{favs=JSON.parse(localStorage.getItem('natinf-favs')||'[]')}catch(e){}const main=document.getElementById('main'),nav=document.getElementById('nav');const profiles=[{key:'g',name:'Gendarmerie nationale',abbr:'GND',id:'NIJ GEND : 455 701'},{key:'p',name:'Police nationale',abbr:'PA',id:'Matricule : 7 149 583'}];
const gLogo=`<svg viewBox="0 0 210 72" role="img" aria-label="Identité graphique Gendarmerie nationale"><path d="M31 7 C12 25 35 33 23 49 C39 43 41 30 37 19 C47 30 46 44 32 54 C53 46 55 26 40 7 C42 22 30 24 31 7Z" fill="#0c3c83"/><circle cx="33" cy="60" r="6" fill="#0c3c83"/><text x="61" y="31" font-size="21" font-weight="800" fill="#0b3478" font-family="Arial,sans-serif">Gendarmerie</text><text x="64" y="51" font-size="16" font-weight="600" letter-spacing="4" fill="#0b3478" font-family="Arial,sans-serif">nationale</text><path d="M64 59 H112" stroke="#154fa8" stroke-width="5"/><path d="M115 59 H145" stroke="#fff" stroke-width="5"/><path d="M148 59 H177" stroke="#ed2939" stroke-width="5"/></svg>`;
const pLogo=`<svg viewBox="0 0 210 72" role="img" aria-label="Identité graphique Police nationale"><path d="M12 45 Q28 24 29 9 L48 9 Q43 31 12 45Z" fill="#164fa9"/><path d="M27 53 Q49 33 49 9 L62 9 Q61 34 27 53Z" fill="#fff" stroke="#e4eaf3" stroke-width=".6"/><path d="M43 59 Q66 37 65 9 L78 9 Q77 38 43 59Z" fill="#e82a40"/><text x="80" y="34" font-size="25" font-style="italic" font-weight="900" fill="#0a244f" font-family="Arial,sans-serif">POLICE</text><text x="83" y="53" font-size="15" font-weight="800" letter-spacing="2" fill="#0a244f" font-family="Arial,sans-serif">NATIONALE</text></svg>`;
function card(p){return `<button class="profile ${profile===p.key?'active':''}" data-profile="${p.key}" aria-pressed="${profile===p.key}"><span class="check">✓</span><div class="logo">${p.key==='g'?gLogo:pLogo}</div><div class="grade">${p.abbr}</div><div class="person">Charles CABELLO</div><div class="number">${p.id}</div></button>`}
function pinDialog(){
 const old=document.getElementById('pin-overlay');if(old)old.remove();
 if(!pendingProfile)return;
 const overlay=document.createElement('div');overlay.id='pin-overlay';overlay.className='pin-overlay';
 overlay.innerHTML=`<div class="pin-dialog" role="dialog" aria-modal="true" aria-label="Saisir le code d'accès"><h2>Code d'accès</h2><p>Profil ${pendingProfile==='g'?'Gendarmerie nationale':'Police nationale'}<br>Saisissez votre code à 4 chiffres.</p><div class="pin-dots">${[0,1,2,3].map(i=>`<span class="pin-dot ${i<pinDigits.length?'filled':''}"></span>`).join('')}</div><div class="pin-keypad">${['1','2','3','4','5','6','7','8','9','','0','⌫'].map(n=>n?`<button type="button" data-pin="${n}" aria-label="${n==='⌫'?'Effacer':n}">${n}</button>`:'<span></span>').join('')}</div><p class="pin-error" role="alert">${pinError}</p><button type="button" class="pin-cancel" data-pin-cancel>Annuler</button></div>`;
 document.body.appendChild(overlay);
}
function beginProfile(k){if(k===profile&&page!=='home')return;pendingProfile=k;pinDigits='';pinError='';pinDialog()}
function pinPress(k){
 if(k==='⌫'){pinDigits=pinDigits.slice(0,-1);pinError='';pinDialog();return}
 if(pinDigits.length>=4)return;pinDigits+=k;
 if(pinDigits.length===4){
  if(pinDigits===ACCESS_PIN){profile=pendingProfile;pendingProfile=null;pinDigits='';pinError='';page='search';cat='';query='';render();return}
  pinDigits='';pinError='Code incorrect. Réessayez.'; 
 }
 pinDialog();
}
function setPage(p){page=p;render()}function render(){nav.hidden=page==='home';nav.innerHTML=`<button data-page="search" class="${page==='search'?'on':''}">⌕ Recherche</button><button data-page="favorites" class="${page==='favorites'?'on':''}">★ Favoris</button><button data-page="home">♙ Profils</button>`;if(page==='home'){main.innerHTML=`<section class="home-screen"><div class="home-content"><div class="hero"><h2>Choisissez votre profil</h2><p class="muted">Sélectionnez votre service pour accéder aux infractions routières.</p><div class="profiles">${profiles.map(card).join('')}</div></div></div><div class="lights" role="img" aria-label="Gyrophare rouge et bleu, lumière fixe"></div></section>`;return}let top=`<div class="profiles topprofiles">${profiles.map(card).join('')}</div>`;if(page==='detail'){const r=records.find(x=>x.id===detail);main.innerHTML=top+`<button class="back" data-page="search">← Retour aux infractions</button><div class="detail"><h2>${r.title}</h2><span class="tag">${r.cat}</span><p>${r.detail}</p><p><strong>Code NATINF :</strong> à vérifier dans le référentiel officiel.</p><button class="button" data-copy="${r.id}">Copier la qualification</button><button class="star ${favs.includes(r.id)?'on':''}" data-fav="${r.id}" aria-label="Favori">★</button></div><div class="warning">Aide à la recherche uniquement. Aucun code NATINF non vérifié n'est affiché. Vérifier les textes et le référentiel en vigueur avant verbalisation.</div>`;return}let list=records.filter(r=>(page!=='favorites'||favs.includes(r.id))&&(!cat||r.cat===cat)&&(!query||(`${r.title} ${r.cat} ${r.keywords}`).toLowerCase().includes(query.toLowerCase())));main.innerHTML=top+`<h2>${page==='favorites'?'Mes favoris':'Recherche rapide'}</h2>${page==='search'?`<input id="query" class="search" placeholder="Rechercher une infraction…" value="${query.replaceAll('&','&amp;').replaceAll('"','&quot;')}"><h3 class="sectiontitle">Catégories</h3><div class="categories">${[['Infractions courantes','🚦'],['Vitesse','🚘'],['Alcool','🍷'],['Titres','🪪'],['Assurance','🛡️'],['Équipement','🔧'],['Téléphone','📱'],['Stupéfiants','⚖️']].map(([n,ic])=>`<button class="cat ${cat===n?'selected':''}" data-cat="${n}"><span>${ic}</span>${n}</button>`).join('')}</div>`:''}<h3 class="sectiontitle">${page==='favorites'?'Infractions enregistrées':'Fiches de recherche'} (${list.length})</h3>${list.map(r=>`<div class="item"><div class="itemmain" data-detail="${r.id}"><strong>${r.title}</strong><small>${r.cat} · NATINF à confirmer</small></div><button class="star ${favs.includes(r.id)?'on':''}" data-fav="${r.id}" aria-label="Ajouter aux favoris">★</button></div>`).join('')||'<p class="muted">Aucun résultat.</p>'}<div class="warning">Base indicative de démonstration : les NATINF ne sont pas encore importés du référentiel officiel. Ne pas utiliser seule pour verbaliser.</div>`}document.addEventListener('click',e=>{const b=e.target.closest('[data-profile],[data-page],[data-cat],[data-fav],[data-detail],[data-copy]');if(!b)return;if(b.dataset.profile){beginProfile(b.dataset.profile)}else if(b.dataset.page){setPage(b.dataset.page)}else if(b.dataset.cat){cat=cat===b.dataset.cat?'':b.dataset.cat;render()}else if(b.dataset.fav){const id=b.dataset.fav;favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];localStorage.setItem('natinf-favs',JSON.stringify(favs));render()}else if(b.dataset.detail){detail=b.dataset.detail;setPage('detail')}else if(b.dataset.copy){const r=records.find(x=>x.id===b.dataset.copy);navigator.clipboard?.writeText(r.title)}});document.addEventListener('click',e=>{const key=e.target.closest('[data-pin]');if(key){pinPress(key.dataset.pin);return}if(e.target.closest('[data-pin-cancel]')){pendingProfile=null;pinDigits='';pinError='';pinDialog()}});document.addEventListener('input',e=>{if(e.target.id==='query'){query=e.target.value;const pos=e.target.selectionStart;render();const i=document.getElementById('query');i?.focus();i?.setSelectionRange(pos,pos)}});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
