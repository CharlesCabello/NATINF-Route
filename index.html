<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b53"><title>NATINF Route</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#182b47;background:#eef2f7}*{box-sizing:border-box}body{margin:0}.app{max-width:540px;margin:auto;min-height:100dvh;background:#f8fafc;box-shadow:0 0 40px #162d4a18}.flag{height:9px;display:grid;grid-template-columns:repeat(3,1fr)}.flag i:nth-child(1){background:#173f90}.flag i:nth-child(2){background:white}.flag i:nth-child(3){background:#e32b40}header{background:#102b53;color:white;padding:20px 20px 18px;text-align:center}header h1{font-size:26px;letter-spacing:2px;margin:0}header small{color:#cbd9ef;letter-spacing:1.5px}.body{padding:22px 18px 96px}.muted{color:#64748b}.center{text-align:center}.profiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.profile{border:2px solid #d9e2ee;background:white;border-radius:17px;padding:18px 7px;min-height:192px;text-align:center;color:#1a3459;cursor:pointer}.profile.active{border-color:#1c4f9d;background:#eaf2ff;box-shadow:0 4px 16px #1c4f9d22}.seal{width:65px;height:65px;border:3px solid #caa44c;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;font-size:29px;background:#102b53;color:#e9c77a}.profile strong{display:block;font-size:13px}.profile .info{font-size:12px;line-height:1.55;margin-top:8px}.hero{padding-top:46px}.hero h2{font-size:23px;text-align:center}.hero p{text-align:center}.lights{height:150px;border-radius:18px;margin-top:35px;background:radial-gradient(ellipse at 28% 58%,#2185ff88,transparent 42%),radial-gradient(ellipse at 76% 53%,#ff294b88,transparent 44%),linear-gradient(120deg,#050e20,#18243d 50%,#080f20);position:relative;overflow:hidden}.lights:before{content:'';position:absolute;left:20%;right:20%;top:58px;height:24px;border-radius:7px;background:linear-gradient(90deg,#0088ff,#75c8ff 42%,#131827 50%,#ff657a 59%,#ed1535);box-shadow:-30px 0 45px #128bff,30px 0 45px #ff2146}.lights:after{content:'';position:absolute;left:35%;right:35%;top:82px;height:25px;background:linear-gradient(#1c2636,#070d17);border-radius:0 0 12px 12px}.hint{font-size:12px;text-align:center;margin-top:16px;color:#73849b}.topprofiles{margin-bottom:20px}.topprofiles .profile{min-height:115px;padding:10px 4px}.topprofiles .seal{width:40px;height:40px;font-size:18px;margin-bottom:5px}.topprofiles .info{font-size:10px;margin-top:3px}.topprofiles strong{font-size:11px}.search{width:100%;border:1px solid #cad6e5;border-radius:13px;padding:15px;font-size:16px;background:white}.sectiontitle{font-size:18px;margin:24px 0 12px}.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cat{border:1px solid #dbe4ef;border-radius:13px;background:white;padding:14px 5px;min-height:88px;color:#19365c;font-size:12px;font-weight:650;cursor:pointer}.cat span{display:block;font-size:26px;margin-bottom:7px}.cat.selected{background:#e9f2ff;border-color:#2357a2}.item{background:white;border:1px solid #dbe4ef;border-radius:13px;margin:10px 0;padding:14px;display:flex;gap:10px;align-items:flex-start}.itemmain{flex:1;cursor:pointer}.item strong{font-size:14px}.item small{display:block;color:#64748b;margin-top:6px}.star{border:0;background:none;color:#a8b5c5;font-size:27px;cursor:pointer}.star.on{color:#e5a523}.tag{display:inline-block;background:#eaf1fc;border-radius:7px;padding:3px 7px;font-size:11px;margin-top:8px}.button{border:0;border-radius:10px;background:#16478b;color:white;padding:12px 15px;font-weight:650;cursor:pointer}.back{background:none;border:0;color:#16478b;font-size:15px;padding:0 0 15px}.detail{background:white;border-radius:15px;padding:20px;border:1px solid #dae4ee}.detail h2{margin-top:0}.detail p{line-height:1.5}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);background:white;border-top:1px solid #dce4ef;display:flex;justify-content:space-around;padding:10px 0 max(10px,env(safe-area-inset-bottom))}nav button{border:0;background:none;color:#49617e;font-size:12px;padding:5px 12px}nav button.on{color:#16478b;font-weight:bold}.warning{font-size:12px;background:#fff7e7;border:1px solid #f1dfb9;padding:12px;border-radius:11px;color:#75511d;margin-top:18px}</style></head><body><div class="app"><div class="flag"><i></i><i></i><i></i></div><header><h1>NATINF ROUTE</h1><small>AIDE À LA RECHERCHE ROUTIÈRE</small></header><main class="body" id="main"></main><nav id="nav" hidden></nav></div><script>
const records=[{id:'route1',title:'Téléphone tenu en main par le conducteur',cat:'Téléphone',keywords:'portable conduite',detail:'Article R.412-6-1 du Code de la route. Contravention de 4e classe, retrait de 3 points. Vérifier la qualification et le NATINF dans le référentiel officiel.'},{id:'route2',title:'Non-port de la ceinture de sécurité',cat:'Équipement',keywords:'ceinture',detail:'Article R.412-1 du Code de la route. Contravention de 4e classe ; retrait de 3 points pour le conducteur selon les conditions applicables.'},{id:'route3',title:'Non-respect d’un feu rouge',cat:'Infractions courantes',keywords:'feu signal rouge',detail:'Article R.412-30 du Code de la route. Contravention de 4e classe, retrait de 4 points.'},{id:'route4',title:'Défaut d’assurance obligatoire',cat:'Assurance',keywords:'non assurance',detail:'Article L.324-2 du Code de la route et L.211-1 du Code des assurances. Délit ; modalités de sanction selon les circonstances.'},{id:'route5',title:'Conduite sans permis correspondant à la catégorie',cat:'Titres',keywords:'permis défaut',detail:'Article L.221-2 du Code de la route. Délit ; vérifier la situation exacte du titre.'},{id:'route6',title:'Conduite sous l’empire d’un état alcoolique',cat:'Alcool',keywords:'alcoolémie',detail:'La qualification dépend notamment du taux mesuré, du statut du conducteur et de la récidive. Vérifier les seuils et les articles applicables.'},{id:'route7',title:'Excès de vitesse',cat:'Vitesse',keywords:'vitesse radar',detail:'La qualification et les sanctions dépendent du dépassement retenu et du contexte. Vérifier la vitesse retenue, la limite et la réglementation en vigueur.'},{id:'route8',title:'Conduite après usage de stupéfiants',cat:'Stupéfiants',keywords:'drogue cannabis',detail:'Article L.235-1 du Code de la route. Délit ; vérifier les éléments constitutifs et les procédures applicables.'}];
let page='home',profile=null,query='',cat='',detail=null,favs=[];try{favs=JSON.parse(localStorage.getItem('natinf-favs')||'[]')}catch(e){}const main=document.getElementById('main'),nav=document.getElementById('nav');const profiles=[{key:'g',name:'Gendarmerie nationale',abbr:'GND',id:'NIJ GEND : 455 701',symbol:'✦'},{key:'p',name:'Police nationale',abbr:'PA',id:'Matricule : 7 149 583',symbol:'⚖'}];function card(p){return `<button class="profile ${profile===p.key?'active':''}" data-profile="${p.key}"><div class="seal">${p.symbol}</div><strong>${p.name}</strong><div class="info">${p.abbr} — Charles CABELLO<br>${p.id}</div></button>`}function setPage(p){page=p;render()}function render(){nav.hidden=page==='home';nav.innerHTML=`<button data-page="search" class="${page==='search'?'on':''}">⌕ Recherche</button><button data-page="favorites" class="${page==='favorites'?'on':''}">★ Favoris</button><button data-page="home">♙ Profils</button>`;if(page==='home'){main.innerHTML=`<section class="hero"><h2>Choisissez votre profil</h2><p class="muted">Sélectionnez votre service pour accéder à la recherche des infractions.</p><div class="profiles" style="margin-top:30px">${profiles.map(card).join('')}</div><div class="lights" role="img" aria-label="Gyrophare rouge et bleu, lumière fixe"></div><div class="hint">Éclairage rouge et bleu fixe · sans son</div></section>`;return}let top=`<div class="profiles topprofiles">${profiles.map(card).join('')}</div>`;if(page==='detail'){const r=records.find(x=>x.id===detail);main.innerHTML=top+`<button class="back" data-page="search">← Retour aux infractions</button><div class="detail"><h2>${r.title}</h2><span class="tag">${r.cat}</span><p>${r.detail}</p><p><strong>Code NATINF :</strong> à vérifier dans le référentiel officiel.</p><button class="button" data-copy="${r.id}">Copier la qualification</button><button class="star ${favs.includes(r.id)?'on':''}" data-fav="${r.id}" aria-label="Favori">★</button></div><div class="warning">Aide à la recherche uniquement. Aucun code NATINF non vérifié n'est affiché. Vérifier les textes et le référentiel en vigueur avant verbalisation.</div>`;return}let list=records.filter(r=>(page!=='favorites'||favs.includes(r.id))&&(!cat||r.cat===cat)&&(!query||(`${r.title} ${r.cat} ${r.keywords}`).toLowerCase().includes(query.toLowerCase())));main.innerHTML=top+`<h2>${page==='favorites'?'Mes favoris':'Recherche rapide'}</h2>${page==='search'?`<input id="query" class="search" placeholder="Rechercher une infraction…" value="${query.replaceAll('&','&amp;').replaceAll('"','&quot;')}"><h3 class="sectiontitle">Catégories</h3><div class="categories">${[['Infractions courantes','🚦'],['Vitesse','🚘'],['Alcool','🍷'],['Titres','🪪'],['Assurance','🛡️'],['Équipement','🔧'],['Téléphone','📱'],['Stupéfiants','⚖️']].map(([n,ic])=>`<button class="cat ${cat===n?'selected':''}" data-cat="${n}"><span>${ic}</span>${n}</button>`).join('')}</div>`:''}<h3 class="sectiontitle">${page==='favorites'?'Infractions enregistrées':'Fiches de recherche'} (${list.length})</h3>${list.map(r=>`<div class="item"><div class="itemmain" data-detail="${r.id}"><strong>${r.title}</strong><small>${r.cat} · NATINF à confirmer</small></div><button class="star ${favs.includes(r.id)?'on':''}" data-fav="${r.id}" aria-label="Ajouter aux favoris">★</button></div>`).join('')||'<p class="muted">Aucun résultat.</p>'}<div class="warning">Base indicative de démonstration : les NATINF ne sont pas encore importés du référentiel officiel. Ne pas utiliser seule pour verbaliser.</div>`}document.addEventListener('click',e=>{const b=e.target.closest('[data-profile],[data-page],[data-cat],[data-fav],[data-detail],[data-copy]');if(!b)return;if(b.dataset.profile){profile=b.dataset.profile;page='search';cat='';query='';render()}else if(b.dataset.page){setPage(b.dataset.page)}else if(b.dataset.cat){cat=cat===b.dataset.cat?'':b.dataset.cat;render()}else if(b.dataset.fav){const id=b.dataset.fav;favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];localStorage.setItem('natinf-favs',JSON.stringify(favs));render()}else if(b.dataset.detail){detail=b.dataset.detail;setPage('detail')}else if(b.dataset.copy){const r=records.find(x=>x.id===b.dataset.copy);navigator.clipboard?.writeText(r.title)}});document.addEventListener('input',e=>{if(e.target.id==='query'){query=e.target.value;const pos=e.target.selectionStart;render();const i=document.getElementById('query');i?.focus();i?.setSelectionRange(pos,pos)}});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
