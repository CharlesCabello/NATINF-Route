// Analyseur CSV compatible avec les cellules entre guillemets et les points-virgules internes.
function parseCSV(text){const out=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===';'&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))out.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);out.push(row)}return out}
function roadCSV(rows){const head=rows[0].map(x=>normalizeText(x).trim());const idx=names=>head.findIndex(h=>names.some(n=>h.includes(n)));const a=idx(['numero natinf']),b=idx(['nature de l']),c=idx(['qualification de l']),d=idx(['definie par']),e=idx(['reprimee par']);if([a,b,c,d,e].some(i=>i<0))throw Error('Colonnes CSV non reconnues');const result=[];for(const r of rows.slice(1)){const id=(r[a]||'').trim();if(!/^\d+$/.test(id))continue;const defined=r[d]||'',punished=r[e]||'';if(!/\bC\.\s*ROUTE\b|CODE DE LA ROUTE/i.test(defined+' '+punished))continue;result.push([id,r[b]||'',r[c]||'',defined,punished])}if(result.length<500)throw Error('Le fichier routier paraît incomplet');return result}
async function checkUpdates(force=false){if(updateState==='loading'||!navigator.onLine)return;const last=localStorage.getItem('natinf-route-last-check');if(!force&&last&&Date.now()-Number(last)<24*3600*1000)return;updateState='loading';updateMessage='';render();try{
 const res=await fetch(DATASET_URL,{cache:'no-store'});if(!res.ok)throw Error('Catalogue inaccessible');const catalog=await res.json();
 const resources=(catalog.resources||[]).filter(r=>r.url&&/csv/i.test(r.format||r.url)&&/natinf/i.test(r.title||''));
 const score=r=>{const name=(r.title||'').toLowerCase();const months={'janvier':1,'avril':4,'juillet':7,'octobre':10};const year=Number((name.match(/20\d{2}/)||[])[0]||0);const month=Object.entries(months).find(([m])=>name.includes(m));return year*100+(month?month[1]:0)};
 resources.sort((a,b)=>score(b)-score(a));const latest=resources[0];if(!latest)throw Error('Aucun CSV NATINF identifié');
 const version=score(latest),current=Number(dbMeta.sourceDate.slice(0,4))*100+Number(dbMeta.sourceDate.slice(5,7));
 if(version>current){updateMessage='Téléchargement de '+latest.title+'…';render();const r=await fetch(latest.url,{cache:'no-store'});if(!r.ok)throw Error('Téléchargement refusé');const bytes=await r.arrayBuffer();let content=new TextDecoder('utf-8',{fatal:false}).decode(bytes);if(content.includes('�'))content=new TextDecoder('windows-1252').decode(bytes);const data=roadCSV(parseCSV(content.replace(/^\uFEFF/,'')));const installed=new Date().toISOString();const next={sourceDate:String(Math.floor(version/100))+'-'+String(version%100).padStart(2,'0')+'-01',sourceTitle:latest.title,installedAt:installed,checkedAt:installed};
 try{localStorage.setItem(DB_KEY,JSON.stringify(data));localStorage.setItem(DB_META,JSON.stringify(next))}catch(e){throw Error('Espace de stockage insuffisant pour conserver la mise à jour hors ligne')}
 dbMeta=next;applyData(data);updateMessage=`${data.length.toLocaleString('fr-FR')} références routières installées.`;
 }else{dbMeta.checkedAt=new Date().toISOString();localStorage.setItem(DB_META,JSON.stringify(dbMeta));updateMessage='La base installée est à jour.'}
 localStorage.setItem('natinf-route-last-check',String(Date.now()));updateState='success';render();
 }catch(e){updateState='error';updateMessage='Base hors ligne conservée. '+(e.message||'Vérification impossible');render()}}

const normalizeText=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const roadWords=/\b(c\.route|code de la route|conducteur|conduite|vehicule|permis de conduire|circulation routiere|automobil|motocycl|cyclomoteur|vitesse|stationnement|immatriculation|pieton|transport routier|assurance automobile|ceinture de securite|telephone au volant|alcool au volant)\b/i;
function categoryFor(r){
 const t=normalizeText(r.title);
 if(/telephone|portable|ecouteur|oreillette/.test(t))return 'Téléphone';
 if(/vitesse|radar/.test(t))return 'Vitesse';
 if(/alcool|ivresse|ethyl/.test(t))return 'Alcool';
 if(/stupefiant|drogue|cannabis/.test(t))return 'Stupéfiants';
 if(/assurance/.test(t))return 'Assurance';
 if(/permis|certificat d'immatriculation|carte grise|immatriculation|titre de conduite/.test(t))return 'Titres';
 if(/ceinture|casque|pneumatique|eclairage|feux|retrovis|equipement/.test(t))return 'Équipement';
 return 'Infractions courantes';
}
function isRoad(r){return roadWords.test(normalizeText(r.title+' '+r.defined+' '+r.punished))}

  else{const res=await fetch('./natinf-octobre2026.json');if(!res.ok)throw Error('Données indisponibles');applyData(await res.json())}
  if(navigator.onLine)checkUpdates(false);
 }catch(e){databaseError=true;render()}
}

const accessCodes={g:[],p:[]};
const vaultKey='natinf-local-vault-v19';
const encoder=new TextEncoder(),decoder=new TextDecoder();
const to64=a=>btoa(String.fromCharCode(...a));
const from64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let vaultUnlocked=false,vaultMessage='',vaultPass=null,codesEditMode=false,addingToPlace=null;
async function deriveVaultKey(pass,salt){const base=await crypto.subtle.importKey('raw',encoder.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function saveVault(pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveVaultKey(pass,salt);const data=encoder.encode(JSON.stringify(accessCodes));const encrypted=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,data));localStorage.setItem(vaultKey,JSON.stringify({salt:to64(salt),iv:to64(iv),data:to64(encrypted)}))}
async function openVault(pass){const raw=localStorage.getItem(vaultKey);if(!raw){vaultUnlocked=true;vaultPass=pass;return}const obj=JSON.parse(raw);const key=await deriveVaultKey(pass,from64(obj.salt));const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(obj.iv)},key,from64(obj.data));const saved=JSON.parse(decoder.decode(plain));accessCodes.g=Array.isArray(saved.g)?saved.g:[];accessCodes.p=Array.isArray(saved.p)?saved.p:[];vaultUnlocked=true;vaultPass=pass}
async function awaitVault(pass){try{await openVault(pass);vaultMessage='Coffre déverrouillé.';render()}catch(e){vaultMessage='Phrase secrète incorrecte ou données illisibles.';render()}}
function showSavePass(){if(!vaultUnlocked||!vaultPass){vaultMessage='Coffre verrouillé.';render();return}saveVault(vaultPass).then(()=>{vaultMessage='Codes sauvegardés dans le coffre chiffré.';render()}).catch(()=>{vaultMessage='Erreur lors du chiffrement.';render()})}
function lockVault(){vaultUnlocked=false;vaultPass=null;codesEditMode=false;addingToPlace=null;accessCodes.g=[];accessCodes.p=[]}

// Correspondances NATINF strictement identifiées ; ne pas extrapoler aux personnes seulement redevables de l’amende.
const VERIFIED_POINTS={
 '202':6,'203':4,'207':4,'210':4,'217':3,'221':4,
 '11325':3,'11326':1,'12929':3,'23800':3
};
const POINTS_SOURCE='https://www.service-public.gouv.fr/particuliers/vosdroits/F31551';
function pointsView(r){
 const n=VERIFIED_POINTS[r.id];
 if(n===undefined)return `<div class="points-panel"><span>Retrait de points</span><strong>À vérifier</strong></div><p class="sanction-note">Aucune correspondance individualisée vérifiée pour ce code NATINF. « À vérifier » ne signifie pas zéro point.</p>`;

}
function sanctionsView(r){
 const match=/^Contravention de classe ([1-5])$/.exec(r.nature);
 const cls=match?Number(match[1]):null;
 const fine=cls&&FINE_SCHEDULE[cls];
 const stationnement=/stationnement/i.test(r.title);
 const forfait=fine&&!stationnement;
 const amount=(key)=>forfait?fine[key]:'À vérifier';
 return `<section class="sanctions"><h3>Sanctions et points</h3><div class="sanction-grid"><div class="sanction-tile"><small>Amende minorée</small><strong>${amount('minor')}</strong></div><div class="sanction-tile prominent"><small>Amende forfaitaire</small><strong>${amount('normal')}</strong></div><div class="sanction-tile"><small>Amende majorée</small><strong>${amount('major')}</strong></div></div>${pointsView(r)}<p class="sanction-note">${forfait?`Barème national de ${cls}e classe, donné à titre indicatif <b>si la procédure forfaitaire est applicable</b>. Il ne confirme pas le montant propre à cette NATINF.`:'Barème individuel non établi pour cette NATINF : régime forfaitaire, exceptions et sanctions spécifiques à vérifier.'} Les retraits de points affichés comme vérifiés sont associés uniquement aux codes NATINF contrôlés individuellement.</p><p class="sanction-source">Sources : <a href="https://www.service-public.gouv.fr/particuliers/vosdroits/F18509" target="_blank" rel="noopener">Service-Public — amendes</a> · <a href="https://www.service-public.gouv.fr/particuliers/vosdroits/F31551" target="_blank" rel="noopener">Service-Public — points</a></p></section>`;
}

  return;
 }
 if(page==='about'){main.innerHTML=top+`<h2>À propos</h2><div class="detail"><strong>Version de l’application : V24</strong><p>Édition du 12 novembre 2026 · Modes lecture et édition, suppression des lignes et des communes, ajout de lignes uniquement en édition.</p></div><div class="powered-by"><span>POWERED BY</span><strong>Charles CABELLO</strong></div><div class="detail"><h3>NATINF Route</h3><p>Référentiel importé : <strong>${escapeHtml(dbMeta.sourceTitle)}</strong>.</p><p>${count.toLocaleString('fr-FR')} références issues du fichier fourni. La rubrique Route utilise un classement indicatif par mots-clés ; la recherche « Tous les NATINF » couvre l’ensemble du fichier.</p><p>Les favoris sont conservés lors des mises à jour sur la même origine Netlify (sans effacer les données Safari). La base est enregistrée dans les fichiers de l’application et mise en cache pour consultation hors ligne après le premier chargement complet.</p><p>La nomenclature ne contient ni montants individualisés ni retraits de points. Les retraits de points vérifiés sont ajoutés pour une sélection de NATINF, sans extrapolation. Vérifiez les textes en vigueur et la situation juridique avant toute verbalisation.</p><button class="button" data-page="home">Changer de profil</button></div>${status}`;return}
 if(page==='dashboard'){main.innerHTML=top+`<h2 class="dash-title">Accueil</h2><p class="muted dash-sub">Recherche rapide des infractions routières</p>${status}<div class="categories dashboard-categories">${categories.map(([n,ic])=>`<button class="cat" data-cat="${escapeHtml(n)}" data-go-search="1"><span>${ic}</span>${n==='Téléphone'?'Téléphone<br>au volant':escapeHtml(n)}</button>`).join('')}</div><button class="button all-natinf" data-all="1">Voir toutes les infractions routières (${count.toLocaleString('fr-FR')})</button>`;return}
 const q=normalizeText(query.trim());
 let list=records.filter(r=>(page!=='favorites'||favs.includes(r.id))&&(!onlyRoad||page==='favorites'||r.road)&&(!cat||cat==='Infractions courantes'||r.cat===cat)&&(!q||normalizeText(r.id+' '+r.title+' '+r.nature+' '+r.defined+' '+r.punished).includes(q)));
 const total=list.length;
 list=list.slice(0,resultsLimit);
 main.innerHTML=top+`<h2>${page==='favorites'?'Mes favoris':'Recherche NATINF'}</h2>${status}${page==='search'?`<input id="query" class="search" placeholder="Numéro NATINF, infraction, article…" value="${escapeHtml(query)}"><div class="scope"><button class="${onlyRoad?'selected':''}" data-scope="road">Code de la route</button></div>${onlyRoad?`<div class="categories">${categories.map(([n,ic])=>`<button class="cat ${cat===n?'selected':''}" data-cat="${escapeHtml(n)}"><span>${ic}</span>${escapeHtml(n)}</button>`).join('')}</div>`:''}`:''}<h3 class="sectiontitle">${page==='favorites'?'Infractions enregistrées':'Résultats'} (${total.toLocaleString('fr-FR')})</h3><div id="results">${list.map(r=>`<div class="item"><div class="itemmain" data-detail="${r.id}"><strong>${escapeHtml(r.title)}</strong><small>NATINF ${r.id} · ${escapeHtml(r.nature)}</small></div><button class="star ${favs.includes(r.id)?'on':''}" data-fav="${r.id}" aria-label="Favori">★</button></div>`).join('')||'<p class="muted">Aucun résultat.</p>'}</div>${total>list.length?`<button class="button more" data-more="1">Afficher davantage (${total-list.length} restants)</button>`:''}<div class="warning">Classement routier indicatif. Les qualifications et références doivent être vérifiées avant verbalisation.</div>`;
}
document.addEventListener('click',e=>{
 const key=e.target.closest('[data-pin]');if(key){pinPress(key.dataset.pin);return}
 if(e.target.closest('[data-pin-cancel]')){pendingProfile=null;pinForCodes=false;pinDigits='';pinError='';pinDialog();return}
 checkIdle();if(!profile&&page!=='home')return;
 const b=e.target.closest('[data-profile],[data-page],[data-cat],[data-fav],[data-detail],[data-copy],[data-scope],[data-all],[data-more],[data-update],[data-save-code],[data-clear-code],[data-reveal-code],[data-unlock-vault],[data-lock-vault],[data-reveal-access],[data-delete-access],[data-move-access],[data-toggle-edit],[data-move-group],[data-move-line],[data-edit-access],[data-add-to-place],[data-cancel-add],[data-delete-group]');
 if(!b)return;
 if(b.dataset.toggleEdit!==undefined){codesEditMode=!codesEditMode;addingToPlace=null;render();return}
 if(b.dataset.deleteGroup!==undefined){if(!vaultUnlocked||!codesEditMode)return;const groups=[...new Set(accessCodes[profile].map(a=>String(a.place||'').trim().toLocaleLowerCase('fr')))],key=groups[Number(b.dataset.deleteGroup)];if(key===undefined)return;const n=accessCodes[profile].filter(a=>String(a.place||'').trim().toLocaleLowerCase('fr')===key).length;if(confirm('Supprimer cette commune et ses '+n+' accès ? Cette action est irréversible.')){accessCodes[profile]=accessCodes[profile].filter(a=>String(a.place||'').trim().toLocaleLowerCase('fr')!==key);addingToPlace=null;showSavePass()}return}
 if(b.dataset.addToPlace!==undefined){if(!codesEditMode||!vaultUnlocked)return;addingToPlace=b.dataset.addToPlace;render();document.querySelector('#access-form input[name=type]')?.focus();return}
 if(b.dataset.cancelAdd!==undefined){addingToPlace=null;render();return}
 if(b.dataset.moveGroup!==undefined){if(!vaultUnlocked)return;const list=accessCodes[profile],keys=[...new Set(list.map(x=>String(x.place).trim().toLocaleLowerCase('fr')))],i=Number(b.dataset.moveGroup),j=i+(b.dataset.direction==='up'?-1:1);if(j<0||j>=keys.length)return;[keys[i],keys[j]]=[keys[j],keys[i]];const order=new Map(keys.map((k,n)=>[k,n]));accessCodes[profile]=list.map((a,n)=>({...a,_pos:n})).sort((a,b)=>order.get(String(a.place).trim().toLocaleLowerCase('fr'))-order.get(String(b.place).trim().toLocaleLowerCase('fr'))||a._pos-b._pos).map(({_pos,...a})=>a);showSavePass();return}
 if(b.dataset.moveLine!==undefined){if(!vaultUnlocked)return;const list=accessCodes[profile],i=Number(b.dataset.moveLine),key=String(list[i]?.place||'').trim().toLocaleLowerCase('fr'),indices=list.map((a,j)=>String(a.place).trim().toLocaleLowerCase('fr')===key?j:-1).filter(j=>j>=0),n=indices.indexOf(i),other=indices[n+(b.dataset.direction==='up'?-1:1)];if(other!==undefined){[list[i],list[other]]=[list[other],list[i]];showSavePass()}return}
 if(b.dataset.editAccess!==undefined){if(!vaultUnlocked)return;const i=Number(b.dataset.editAccess),a=accessCodes[profile]?.[i];if(!a)return;const type=prompt('Nom de l’accès',a.type);if(type===null)return;const secret=prompt('Code d’accès',a.secret);if(secret===null)return;if(!type.trim()||!secret.trim())return;a.type=type.trim();a.secret=secret.trim();showSavePass();return}
 if(b.dataset.revealAccess!==undefined){const i=Number(b.dataset.revealAccess),item=accessCodes[profile]?.[i],el=document.getElementById('secret-'+i);if(item&&el&&vaultUnlocked){el.textContent=item.secret;setTimeout(()=>{if(el.isConnected)el.textContent='••••••'},12000)}return}
 if(b.dataset.moveAccess!==undefined){const i=Number(b.dataset.moveAccess),j=i+(b.dataset.direction==='up'?-1:1),items=accessCodes[profile];if(vaultUnlocked&&items&&i>=0&&i<items.length&&j>=0&&j<items.length){[items[i],items[j]]=[items[j],items[i]];showSavePass()}return}
 if(b.dataset.deleteAccess!==undefined){if(!codesEditMode)return;const i=Number(b.dataset.deleteAccess);if(vaultUnlocked&&accessCodes[profile]?.[i]&&confirm('Supprimer cet accès ?')){accessCodes[profile].splice(i,1);showSavePass()}return}
 if(b.dataset.unlockVault!==undefined){const pass=document.getElementById('vault-pass')?.value||'';if(!localStorage.getItem(vaultKey)&&pass.length<12){vaultMessage='Choisir une phrase secrète d’au moins 12 caractères.';render();return}try{awaitVault(pass)}catch(e){vaultMessage='Impossible de déverrouiller.';render()}return}
 else if(b.dataset.lockVault!==undefined){lockVault();vaultMessage='Coffre verrouillé.';render();return}
 else if(b.dataset.saveCode!==undefined){const place=accessPlaces[profile]?.[Number(b.dataset.saveCode)];const input=document.getElementById('code-'+b.dataset.saveCode);if(place&&input?.value.trim()){accessCodes[profile][place]=input.value.trim();vaultMessage='Code en mémoire : saisir la phrase secrète pour sauvegarder le coffre chiffré.';showSavePass();}return}
 else if(b.dataset.revealCode!==undefined){const i=Number(b.dataset.revealCode),place=accessPlaces[profile]?.[i];const el=document.getElementById('code-value-'+i);if(el&&place&&vaultUnlocked){el.textContent=accessCodes[profile][place]||'';setTimeout(()=>{if(el.isConnected)el.textContent='••••••'},12000)}return}
 else if(b.dataset.clearCode!==undefined){const place=accessPlaces[profile]?.[Number(b.dataset.clearCode)];if(place){delete accessCodes[profile][place];showSavePass()}return}
 else if(b.dataset.update){checkUpdates(true)}
 else if(b.dataset.profile){beginProfile(b.dataset.profile)}
 else if(b.dataset.page){setPage(b.dataset.page)}
 else if(b.dataset.scope){onlyRoad=b.dataset.scope==='road';cat='';resultsLimit=60;render()}
 else if(b.dataset.all){onlyRoad=false;cat='';query='';page='search';resultsLimit=60;render()}
 else if(b.dataset.more){resultsLimit+=80;render()}
 else if(b.dataset.cat){cat=b.dataset.cat==='Infractions courantes'?'':(cat===b.dataset.cat?'':b.dataset.cat);if(b.dataset.goSearch){onlyRoad=true;page='search'}resultsLimit=60;render()}
 else if(b.dataset.fav){const id=b.dataset.fav;favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];localStorage.setItem('natinf-favs',JSON.stringify(favs));render()}
 else if(b.dataset.detail){detail=b.dataset.detail;page='detail';render()}
 else if(b.dataset.copy){const r=records.find(x=>x.id===b.dataset.copy);if(r)navigator.clipboard?.writeText(`NATINF ${r.id}\n${r.title}\nDéfinie par : ${r.defined}\nRéprimée par : ${r.punished}`)}
});
document.addEventListener('submit',e=>{
 if(e.target.id==='vault-form'){e.preventDefault();const pass=document.getElementById('vault-pass')?.value||'';if(!localStorage.getItem(vaultKey)&&pass.length<12){vaultMessage='Phrase secrète : au moins 12 caractères.';render();return}awaitVault(pass);return}
 if(e.target.id==='access-form'){e.preventDefault();if(!vaultUnlocked||!profile||!codesEditMode)return;const f=new FormData(e.target),place=String(f.get('place')||'').trim(),type=String(f.get('type')||'').trim(),secret=String(f.get('secret')||'').trim();if(!place||!type||!secret)return;accessCodes[profile].push({place,type,secret});addingToPlace=null;showSavePass()}
});
document.addEventListener('input',e=>{if(e.target.id==='query'){query=e.target.value;resultsLimit=60;render();const i=document.getElementById('query');i?.focus();i?.setSelectionRange(query.length,query.length)}});
render();loadDatabase();window.addEventListener('online',()=>checkUpdates(false));
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
